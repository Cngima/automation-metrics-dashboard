[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-metrics"
version = "1.0.0"
description = "Measure scheduled AI automations: runs, outcomes, incidents, reliability and time saved, synced read-only from Make."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Carol Njogu" }]
dependencies = ["requests>=2.31", "pyyaml>=6", "pandas>=2.0", "streamlit>=1.35", "altair>=5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
amd = "automation_metrics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
